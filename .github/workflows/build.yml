name: Build xQUILER

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -B build -A x64

      - name: Compilar
        run: cmake --build build --config Release --target XQUILER_VST3 --parallel 4

      - name: Subir VST3
        uses: actions/upload-artifact@v4
        with:
          name: xQUILER-VST3-Windows
          path: build/XQUILER_artefacts/Release/VST3/
